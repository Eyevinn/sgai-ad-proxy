name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pssh-box pulls in prost-build, whose build script requires protoc.
      # Without this the build fails before compiling any of our own code.
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Blocking: the crate must compile, all three bin targets included.
      - name: Build
        run: cargo build --all-targets --verbose

      # Blocking. Note there are currently no tests in this repo, so this
      # passes trivially — it exists so that tests added later are actually run.
      - name: Test
        run: cargo test --all-targets --verbose

      # Both of these were verified clean against main before being made
      # blocking (run 35226337757), so they enforce an existing standard
      # rather than imposing a new one.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
